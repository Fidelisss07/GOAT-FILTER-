name: Build Windows

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Instalar dependências
        run: npm ci

      - name: Testes da interface
        run: |
          npm run typecheck
          npm test

      - name: Testes do núcleo
        run: cargo test -p goat-core

      - name: Gerar instalador (.exe)
        run: npx tauri build

      - name: Publicar instalador e executável
        uses: actions/upload-artifact@v4
        with:
          name: goat-filter-windows
          path: |
            target/release/bundle/nsis/*.exe
            target/release/goat-filter.exe
          if-no-files-found: error
