name: Publicar versão

# Gera o instalador e cria a página da versão em "Releases".
# Rode pela aba Actions › "Publicar versão" › Run workflow,
# ou empurre uma tag no formato v1.2.3.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ffmpeg:
    # FFmpeg mínimo do gravador (só recompila quando o script muda).
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - id: cache
        uses: actions/cache@v4
        with:
          path: ffmpeg-out/ffmpeg.exe
          key: ffmpeg-${{ hashFiles('scripts/build-ffmpeg.sh') }}

      - name: Compilar FFmpeg
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-mingw-w64-x86-64-win32 binutils-mingw-w64-x86-64 mingw-w64-x86-64-dev nasm pkg-config make
          bash scripts/build-ffmpeg.sh "$RUNNER_TEMP/ffbuild" ffmpeg-out/ffmpeg.exe

      - uses: actions/upload-artifact@v4
        with:
          name: ffmpeg
          path: ffmpeg-out/ffmpeg.exe
          if-no-files-found: error

  release:
    needs: ffmpeg
    runs-on: windows-latest
    env:
      # Assinatura gratuita (SignPath Foundation). Fica desligada até o
      # segredo SIGNPATH_API_TOKEN existir. Veja docs/ASSINATURA.md.
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
      # Opcional: Deploy Hook da Vercel para o site pegar a versão nova.
      VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/download-artifact@v4
        with:
          name: ffmpeg
          path: src-tauri/bin

      - name: Conferir o FFmpeg do gravador
        shell: pwsh
        run: |
          $ff = "src-tauri/bin/ffmpeg.exe"
          "Tamanho: {0:N1} MB" -f ((Get-Item $ff).Length / 1MB)
          $filters = & $ff -hide_banner -filters 2>&1 | Out-String
          $encoders = & $ff -hide_banner -encoders 2>&1 | Out-String
          foreach ($f in "ddagrab", "scale_d3d11", "hwdownload", "amix", "aresample", "trim", "atrim", "format", "scale", "crop", "asplit") {
            if ($filters -notmatch "\b$f\b") { throw "filtro $f ausente" }
          }
          $bsfs = & $ff -hide_banner -bsfs 2>&1 | Out-String
          foreach ($x in "dump_extra", "aac_adtstoasc") {
            if ($bsfs -notmatch "\b$x\b") { throw "bsf $x ausente" }
          }
          $muxers = & $ff -hide_banner -muxers 2>&1 | Out-String
          foreach ($x in "segment", "mpegts", "mp4", "rawvideo") {
            if ($muxers -notmatch "\b$x\b") { throw "muxer $x ausente" }
          }
          foreach ($e in "h264_nvenc", "h264_amf", "h264_mf", "aac") {
            if ($encoders -notmatch "\b$e\b") { throw "codificador $e ausente" }
          }
          # Pedaços .ts com o codificador do Windows (software) e junta em .mp4.
          $tmp = New-Item -ItemType Directory "$env:RUNNER_TEMP/rec" -Force
          & $ff -hide_banner -loglevel error -f lavfi -i "testsrc2=size=640x360:rate=30:duration=7" -f lavfi -i "anullsrc=r=48000:cl=stereo" -shortest `
            -map 0:v -map 1:a -vf format=nv12 -c:v h264_mf -g 60 -bsf:v dump_extra=freq=keyframe -c:a aac `
            -f segment -segment_time 2 -segment_format mpegts -reset_timestamps 0 "$tmp/seg-%06d.ts" 2> "$tmp/seg.log"
          if ($LASTEXITCODE -ne 0) {
            $log = Get-Content "$tmp/seg.log" -Raw
            $log
            # Só aceita pular se o problema for o Media Foundation do runner.
            if ($log -match "h264_mf|MFT|Media Foundation|mf_") { Write-Warning "Media Foundation indisponível no runner; teste do clipe pulado"; exit 0 }
            throw "falha ao gravar pedaços"
          }
          $segs = Get-ChildItem "$tmp/seg-*.ts" | Sort-Object Name
          if ($segs.Count -lt 3) { throw "poucos pedaços: $($segs.Count)" }
          $out = [IO.File]::Create("$tmp/all.ts"); foreach ($s in $segs) { $b = [IO.File]::ReadAllBytes($s.FullName); $out.Write($b, 0, $b.Length) }; $out.Close()
          & $ff -hide_banner -loglevel error -sseof -4 -i "$tmp/all.ts" -map 0 -c copy -bsf:a aac_adtstoasc -movflags +faststart "$tmp/clip.mp4"
          if ($LASTEXITCODE -ne 0) { throw "falha ao gerar mp4" }
          "Clipe de teste: {0:N0} KB" -f ((Get-Item "$tmp/clip.mp4").Length / 1KB)
          # Ferramentas dos clipes: miniatura, compressão e vertical.
          & $ff -hide_banner -loglevel error -y -ss 1 -i "$tmp/clip.mp4" -frames:v 1 -vf scale=320:-2 -q:v 6 -f image2 "$tmp/thumb.jpg"
          if ($LASTEXITCODE -ne 0) { throw "falha na miniatura" }
          & $ff -hide_banner -loglevel error -y -i "$tmp/clip.mp4" -map 0:v:0 -map 0:a:0? -vf "scale=-2:'min(720,ih)',format=nv12" -c:v h264_mf -b:v 1000k -c:a aac -b:a 96k "$tmp/small.mp4"
          if ($LASTEXITCODE -ne 0) { throw "falha ao comprimir" }
          & $ff -hide_banner -loglevel error -y -i "$tmp/clip.mp4" -map 0:v:0 -vf "crop='min(iw,ih*9/16)':ih,scale=1080:1920,format=nv12" -c:v h264_mf -b:v 4000k "$tmp/vert.mp4"
          if ($LASTEXITCODE -ne 0) { throw "falha no vertical" }
          # Teste de imagem do gravador: um quadro 16x9 em cinza (144 bytes).
          & $ff -hide_banner -loglevel error -y -ss 0.6 -i "$tmp/clip.mp4" -frames:v 1 -vf "scale=16:9,format=gray" -f rawvideo "$tmp/frame.raw"
          if ($LASTEXITCODE -ne 0 -or (Get-Item "$tmp/frame.raw").Length -ne 144) { throw "falha no teste de imagem" }
          "Miniatura, compressão, vertical e teste de imagem: ok"

      - name: Instalar dependências
        run: npm ci

      - name: Testes
        run: |
          npm run typecheck
          npm test
          cargo test -p goat-core

      - name: Gerar instalador
        run: npx tauri build

      - name: Preparar arquivos
        shell: pwsh
        run: |
          $v = (Get-Content package.json | ConvertFrom-Json).version
          New-Item -ItemType Directory release -Force | Out-Null
          Copy-Item (Get-ChildItem target/release/bundle/nsis/*.exe | Select-Object -First 1).FullName "release/GoatFilter-$v-instalador.exe"
          Copy-Item target/release/goat-filter.exe "release/GoatFilter-$v-portatil.exe"
          # Nomes fixos: o site usa .../releases/latest/download/<nome> e
          # sempre baixa a versão mais nova.
          Copy-Item "release/GoatFilter-$v-instalador.exe" "release/GoatFilter-instalador.exe"
          Copy-Item "release/GoatFilter-$v-portatil.exe" "release/GoatFilter-portatil.exe"
          "VERSION=$v" >> $env:GITHUB_ENV

      - name: Enviar para assinatura (opcional)
        id: unsigned
        if: env.SIGNPATH_API_TOKEN != ''
        uses: actions/upload-artifact@v4
        with:
          name: nao-assinado
          path: release/*.exe

      - name: Assinar com SignPath (opcional)
        if: env.SIGNPATH_API_TOKEN != ''
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: goat-filter
          signing-policy-slug: release-signing
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: release

      - name: Gerar latest.json (o app lê para se atualizar)
        shell: pwsh
        run: |
          $file = "GoatFilter-$env:VERSION-instalador.exe"
          $hash = (Get-FileHash "release/$file" -Algorithm SHA256).Hash.ToLower()
          @{ version = $env:VERSION; tag = "v$env:VERSION"; installer = $file; sha256 = $hash } |
            ConvertTo-Json | Set-Content -Encoding utf8NoBOM release/latest.json
          Get-Content release/latest.json

      - name: Criar a versão em Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: Goat Filter ${{ env.VERSION }}
          files: |
            release/*.exe
            release/latest.json
          generate_release_notes: true
          body: |
            ## Baixar
            - **GoatFilter-${{ env.VERSION }}-instalador.exe**: instala e cria atalho (recomendado)
            - **GoatFilter-${{ env.VERSION }}-portatil.exe**: roda sem instalar

            Windows 10 ou 11. Se aparecer "O Windows protegeu o computador", clique em
            **Mais informações › Executar assim mesmo** (veja docs/ASSINATURA.md).

            Free code signing provided by [SignPath.io](https://about.signpath.io), certificate by [SignPath Foundation](https://signpath.org).
            Privacidade: [PRIVACY.md](https://github.com/Fidelisss07/GOAT-FILTER-/blob/main/PRIVACY.md)

      - name: Atualizar o site (opcional)
        if: env.VERCEL_DEPLOY_HOOK != ''
        shell: pwsh
        run: Invoke-RestMethod -Method Post -Uri $env:VERCEL_DEPLOY_HOOK | Out-Null
