name: Publicar versão

# Gera o instalador e cria a página da versão em "Releases".
# Rode pela aba Actions › "Publicar versão" › Run workflow,
# ou empurre uma tag no formato v1.2.3.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      # Assinatura gratuita (SignPath Foundation). Fica desligada até o
      # segredo SIGNPATH_API_TOKEN existir. Veja docs/ASSINATURA.md.
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
      # Opcional: Deploy Hook da Vercel para o site pegar a versão nova.
      VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Instalar dependências
        run: npm ci

      - name: Testes
        run: |
          npm run typecheck
          npm test
          cargo test -p goat-core

      - name: Gerar instalador
        run: npx tauri build

      - name: Preparar arquivos
        shell: pwsh
        run: |
          $v = (Get-Content package.json | ConvertFrom-Json).version
          New-Item -ItemType Directory release -Force | Out-Null
          Copy-Item (Get-ChildItem target/release/bundle/nsis/*.exe | Select-Object -First 1).FullName "release/GoatFilter-$v-instalador.exe"
          Copy-Item target/release/goat-filter.exe "release/GoatFilter-$v-portatil.exe"
          # Nomes fixos: o site usa .../releases/latest/download/<nome> e
          # sempre baixa a versão mais nova.
          Copy-Item "release/GoatFilter-$v-instalador.exe" "release/GoatFilter-instalador.exe"
          Copy-Item "release/GoatFilter-$v-portatil.exe" "release/GoatFilter-portatil.exe"
          "VERSION=$v" >> $env:GITHUB_ENV

      - name: Enviar para assinatura (opcional)
        id: unsigned
        if: env.SIGNPATH_API_TOKEN != ''
        uses: actions/upload-artifact@v4
        with:
          name: nao-assinado
          path: release/*.exe

      - name: Assinar com SignPath (opcional)
        if: env.SIGNPATH_API_TOKEN != ''
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: goat-filter
          signing-policy-slug: release-signing
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: release

      - name: Gerar latest.json (o app lê para se atualizar)
        shell: pwsh
        run: |
          $file = "GoatFilter-$env:VERSION-instalador.exe"
          $hash = (Get-FileHash "release/$file" -Algorithm SHA256).Hash.ToLower()
          @{ version = $env:VERSION; tag = "v$env:VERSION"; installer = $file; sha256 = $hash } |
            ConvertTo-Json | Set-Content -Encoding utf8NoBOM release/latest.json
          Get-Content release/latest.json

      - name: Criar a versão em Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: Goat Filter ${{ env.VERSION }}
          files: |
            release/*.exe
            release/latest.json
          generate_release_notes: true
          body: |
            ## Baixar
            - **GoatFilter-${{ env.VERSION }}-instalador.exe**: instala e cria atalho (recomendado)
            - **GoatFilter-${{ env.VERSION }}-portatil.exe**: roda sem instalar

            Windows 10 ou 11. Se aparecer "O Windows protegeu o computador", clique em
            **Mais informações › Executar assim mesmo** (veja docs/ASSINATURA.md).

            Free code signing provided by [SignPath.io](https://about.signpath.io), certificate by [SignPath Foundation](https://signpath.org).
            Privacidade: [PRIVACY.md](https://github.com/Fidelisss07/GOAT-FILTER-/blob/main/PRIVACY.md)

      - name: Atualizar o site (opcional)
        if: env.VERCEL_DEPLOY_HOOK != ''
        shell: pwsh
        run: Invoke-RestMethod -Method Post -Uri $env:VERCEL_DEPLOY_HOOK | Out-Null
